version: '3.8'

services:
  # DragonflyDB - High-performance Redis alternative
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: shaman-dragonfly
    restart: unless-stopped
    # Bind to localhost only for security (internal service)
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - dragonfly-data:/data
    command: >
      dragonfly
      --requirepass ${DRAGONFLY_PASSWORD:-changeme}
      --maxmemory 512mb
      --save_schedule "*:*"
    # Resource limits to prevent resource exhaustion
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M  # 512MB + buffer for overhead
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${DRAGONFLY_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shaman-network

  # RabbitMQ - Message queue for async jobs
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shaman-rabbitmq
    restart: unless-stopped
    # Bind to localhost only for security (internal service)
    ports:
      - "127.0.0.1:5672:5672"   # AMQP port
      - "127.0.0.1:15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # Resource limits to prevent resource exhaustion
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shaman-network

  shaman-journey:
    build:
      context: .
      dockerfile: Dockerfile
      # Cache dependencies for faster rebuilds
      cache_from:
        - shaman-journey:latest
    image: shaman-journey:latest
    container_name: shaman-journey-game

    # Restart policy for production
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M

    # Volume mounts for persistent data
    volumes:
      # Persist save files
      - ./saves:/app/saves
      # Optional: Mount assets directory for development
      - ./assets:/app/assets:ro

    # Environment variables
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - DRAGONFLY_URL=redis://:${DRAGONFLY_PASSWORD:-changeme}@dragonfly:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (except for volumes)
    read_only: true

    # Temporary filesystem for writable directories
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "-x", "bevy_shaman"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Depends on services
    depends_on:
      dragonfly:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - shaman-network

# Named volumes for better management
volumes:
  saves:
    driver: local
  dragonfly-data:
    driver: local
  rabbitmq-data:
    driver: local

# Networks for service communication
networks:
  shaman-network:
    driver: bridge
