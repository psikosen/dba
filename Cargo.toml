[workspace]
resolver = "2"
members = [
    "crates/bevy_shaman",
    "crates/bevy_shaman_core",
    "crates/bevy_shaman_combat",
    "crates/bevy_shaman_audio",
    "crates/bevy_shaman_monsters",
    "crates/bevy_shaman_minions",
    "crates/bevy_shaman_world",
    "crates/bevy_shaman_dungeons",
    "crates/bevy_shaman_items",
    "crates/bevy_shaman_ui",
    "crates/bevy_shaman_story",
    "crates/bevy_shaman_save",
    "crates/bevy_shaman_ai",
    "crates/bevy_shaman_shop",
    "crates/bevy_shaman_tutorial",
    "crates/bevy_shaman_monitoring",
]
# Exclude audio crate from default builds (requires ALSA on Linux)
# To build with audio: cargo build -p bevy_shaman_audio
default-members = [
    "crates/bevy_shaman",
    "crates/bevy_shaman_core",
    "crates/bevy_shaman_combat",
    "crates/bevy_shaman_monsters",
    "crates/bevy_shaman_minions",
    "crates/bevy_shaman_world",
    "crates/bevy_shaman_dungeons",
    "crates/bevy_shaman_items",
    "crates/bevy_shaman_ui",
    "crates/bevy_shaman_story",
    "crates/bevy_shaman_save",
    "crates/bevy_shaman_ai",
    "crates/bevy_shaman_shop",
    "crates/bevy_shaman_tutorial",
    "crates/bevy_shaman_monitoring",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.15.4", default-features = false, features = [
    "bevy_asset",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_state",
    "bevy_gilrs",
    "png",
    "x11",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

# Monitoring and Observability
prometheus = "0.13"
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optimized release profile for production builds
[profile.release]
# Maximum optimization level
opt-level = 3
# Thin LTO (Link-Time Optimization) for better optimization with reasonable compile times
lto = "thin"
# Reduce number of codegen units for better optimization (slower compile, faster runtime)
codegen-units = 1
# Strip debug symbols from binary to reduce size
strip = true
# Abort on panic instead of unwinding (smaller binary, faster panic)
panic = "abort"
# Enable overflow checks even in release (safety over performance)
overflow-checks = true

# Development profile with faster compile times
[profile.dev]
# Minimal optimization for faster compilation
opt-level = 0
# No LTO in development
lto = false
# More codegen units for faster parallel compilation
codegen-units = 256
# Keep debug info for debugging
debug = true
# Unwind on panic for better error messages
panic = "unwind"

# Profile for testing with some optimizations
[profile.test]
# Light optimization for faster test execution
opt-level = 1
# Inherit from dev profile
inherits = "dev"

# Profile for benchmarks (similar to release but with debug info)
[profile.bench]
# Maximum optimization
opt-level = 3
# Thin LTO
lto = "thin"
# Keep some debug info for profiling
debug = true
# Same as release
codegen-units = 1