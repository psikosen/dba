[package]
name = "bevy_shaman"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Audio feature requires ALSA on Linux (libasound2-dev)
# Enable with: cargo build --features audio
audio = ["bevy_shaman_audio", "bevy_shaman_ui/audio"]

[dependencies]
bevy.workspace = true
bevy_shaman_core = { path = "../bevy_shaman_core" }
bevy_shaman_combat = { path = "../bevy_shaman_combat" }
bevy_shaman_audio = { path = "../bevy_shaman_audio", optional = true }
bevy_shaman_monsters = { path = "../bevy_shaman_monsters" }
bevy_shaman_minions = { path = "../bevy_shaman_minions" }
bevy_shaman_world = { path = "../bevy_shaman_world" }
bevy_shaman_dungeons = { path = "../bevy_shaman_dungeons" }
bevy_shaman_items = { path = "../bevy_shaman_items" }
bevy_shaman_ui = { path = "../bevy_shaman_ui" }
bevy_shaman_story = { path = "../bevy_shaman_story" }
bevy_shaman_save = { path = "../bevy_shaman_save" }
bevy_shaman_ai = { path = "../bevy_shaman_ai" }
bevy_shaman_shop = { path = "../bevy_shaman_shop" }
bevy_shaman_tutorial = { path = "../bevy_shaman_tutorial" }
