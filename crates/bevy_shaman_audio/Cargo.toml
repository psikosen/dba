[package]
name = "bevy_shaman_audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Audio crate uses bevy with audio features
# On systems without ALSA, exclude this crate from the workspace
bevy = { version = "0.15", default-features = false, features = ["bevy_audio"] }
bevy_shaman_core = { path = "../bevy_shaman_core" }
# Note: Circular dependency issue - combat depends on audio, so we can't depend on combat here
# These dependencies are commented out to prevent the cycle. The related sound systems are also commented out.
# bevy_shaman_combat = { path = "../bevy_shaman_combat" }
# bevy_shaman_story = { path = "../bevy_shaman_story" }
serde.workspace = true
