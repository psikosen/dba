global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    monitor: 'shaman-journey'
    environment: 'staging'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'shaman-journey-staging'
    static_configs:
      - targets: ['shaman-journey-staging:9091']
    metrics_path: '/metrics'
    scrape_interval: 5s
